version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: wanderlust_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wanderlust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wanderlust_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wanderlust_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wanderlust} -d ${POSTGRES_DB:-wanderlust_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wanderlust_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderlust_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://wanderlust:wanderlust_secure_pass@postgres:5432/wanderlust_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=wanderlust_super_secret_jwt_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderlust_worker
    command: python worker.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://wanderlust:wanderlust_secure_pass@postgres:5432/wanderlust_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
